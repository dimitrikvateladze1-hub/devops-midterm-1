name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version to deploy to production (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (lowercase) and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build --build-arg APP_VERSION="$VERSION" -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      VERSION: ${{ needs.build-and-push.outputs.version }}
    steps:
      - name: Checkout (for smoke script)
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start staging container
        run: docker run -d --name staging -p 3000:3000 "$IMAGE:$VERSION"

      - name: Smoke test staging
        run: bash scripts/smoke.sh http://localhost:3000

      - name: Show container logs on failure
        if: failure()
        run: docker logs staging || true

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout (for smoke script)
        uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          docker pull "$IMAGE:$VERSION"
          docker run -d --name production -p 3000:3000 "$IMAGE:$VERSION"

      - name: Smoke test production
        run: bash scripts/smoke.sh http://localhost:3000

      - name: Show deployed version
        run: curl -fsS http://localhost:3000/version
